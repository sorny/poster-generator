name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The app ships its libraries in vendor/, and the tests read PDFs with the
      # same vendored build, so no install step is needed.
      - name: Check every module parses
        run: |
          for f in js/*.js test/*.js server.js scripts/*.js; do
            node --check "$f"
          done

      - name: Run the suite against headless Chrome
        run: npm test
        env:
          CI: 'true'
          CHROME_PATH: /usr/bin/google-chrome
